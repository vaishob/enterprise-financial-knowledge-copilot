name: quality-gates
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      semantic:
        description: Run paid semantic judges (requires repository secrets)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: copilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
      TEST_POSTGRES_URL: postgresql+psycopg://copilot:ci-synthetic-only@localhost:5432/copilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev,eval,jev]' build
      - name: Initialize vector extension in the ephemeral test database
        run: docker exec ${{ job.services.postgres.id }} psql -U copilot -d copilot_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: python -m ruff check backend evals scripts
      - run: python -m mypy backend
      - run: python -m pytest
      - run: python -m scripts.scan_secrets
      - run: python -m evals.runners.run --suite deterministic --split regression
      - run: python -m build
      - run: npm ci && npm run lint && npm run typecheck && npm run build
        working-directory: frontend
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: curl --fail http://localhost:8000/ready && curl --fail http://localhost:3000
      - if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-evaluation-reports
          path: evals/reports/
  semantic:
    if: github.event_name == 'workflow_dispatch' && inputs.semantic
    runs-on: ubuntu-latest
    needs: core
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,eval,jev]'
      - run: python -m evals.runners.run --suite deepeval --split regression --require-semantic --enforce-quality
      - run: python -m evals.runners.run --suite jev --split regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-evaluation-reports
          path: evals/reports/
