[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-financial-knowledge-copilot"
version = "0.1.0"
description = "Synthetic financial-policy RAG with authorization and evaluation controls"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.36,<2.1", "pgvector>=0.3.6,<1",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "opentelemetry-api>=1.29,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "mypy>=1.14,<3", "build>=1.2,<2", "setuptools>=75"]
aws = ["boto3>=1.35,<2"]
local-embeddings = ["sentence-transformers>=3.4,<6"]
eval = ["deepeval==4.2.6"]
jev = ["typesafe-sdk==0.7.1"]
telemetry = ["opentelemetry-sdk>=1.29,<2", "opentelemetry-exporter-otlp-proto-http>=1.29,<2"]

[tool.setuptools.packages.find]
include = ["backend*", "evals*", "scripts*", "synthetic_data*"]

[tool.setuptools.package-data]
evals = ["config.json", "datasets/*.json"]
synthetic_data = ["corpus.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "evals/tests"]
addopts = "-ra"
markers = ["integration: integration checks", "security: security regression checks", "provider: external provider checks", "postgres: live PostgreSQL checks", "semantic: credentialed judge evaluation"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["frontend", "work"]
